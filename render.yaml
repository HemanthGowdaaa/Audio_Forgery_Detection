# =============================================================================
# render.yaml — Render Blueprint for Audio Forgery Detection
# =============================================================================
# Services match the already-deployed Render service names:
#   Backend : https://audio-forgery-detection-backend.onrender.com
#   Frontend: https://audio-forgery-detection-frontend.onrender.com
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Service 1: Django Backend Web Service
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: audio-forgery-detection-backend
    runtime: python
    region: oregon
    plan: starter         # 2 GB RAM — required to load both ML models
    rootDir: django_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn audio_forgery_project.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 180 --preload"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: "true"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: HF_REPO_ID
        value: Hkm2003/audio-forgery-models-bucket
      - key: FRONTEND_URL
        value: https://audio-forgery-detection-frontend.onrender.com

  # ─────────────────────────────────────────────────────────────────────────
  # Service 2: React / Vite Static Site (Frontend)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: audio-forgery-detection-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA catch-all for React Router
    envVars:
      - key: VITE_API_BASE_URL
        value: https://audio-forgery-detection-backend.onrender.com
      - key: NODE_VERSION
        value: 20.11.0
